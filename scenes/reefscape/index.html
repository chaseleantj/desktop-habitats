<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1825" />
    <meta
      name="description"
      content="A saltwater aquarium with three clownfish, a host anemone, small shoals and cleaner shrimp. A local, interactive 3D aquarium preview."
    />
    <title>Reefscape • Desktop Habitats</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="habitat" aria-label="Interactive saltwater aquarium">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="A saltwater tank with three clownfish, an anemone, small reef fish and cleaner shrimp. Click to feed. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Aquariums">
        <a class="home-link" href="../../" aria-label="Habitats home">Habitats</a>
        <div class="scene-nav">
          <a href="../riverscape/">Riverscape</a>
          <span aria-current="page">Reefscape</span>
        </div>
      </nav>
      <footer class="chrome" aria-label="Aquarium controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="feed">Feed</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Loading aquarium…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
