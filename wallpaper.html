<!doctype html>
<html lang="en" data-fit="fill" data-motion="host">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080e0c" />
    <meta
      name="description"
      content="The living freshwater aquascape, framed to fill a screen as a desktop wallpaper."
    />
    <title>Aquatica • Desktop wallpaper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script>
      // One rendered pixel per screen pixel, and never below the preview's sampling.
      document.documentElement.dataset.resolution = String(
        Math.min(2, Math.max(1.5, window.devicePixelRatio || 1)),
      );
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="aquatica" aria-label="Interactive freshwater aquarium">
      <canvas id="scene" tabindex="-1"></canvas>
      <div id="loading" aria-hidden="true"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
